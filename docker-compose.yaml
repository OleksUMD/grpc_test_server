services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres_container
    environment:
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=${PG_DB}
    ports:
      - "5443:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "bank_db"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
